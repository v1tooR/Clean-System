<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      ;(() => {
        try {
          const savedTheme = localStorage.getItem('ac-clean-theme')
          const systemTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          const theme = savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : systemTheme
          document.documentElement.classList.toggle('dark', theme === 'dark')
          document.documentElement.dataset.theme = theme
          const savedTextScale = localStorage.getItem('ac-clean-text-scale')
          document.documentElement.dataset.textScale =
            savedTextScale === 'large' ? 'large' : 'comfortable'
        } catch {
          document.documentElement.classList.add('dark')
          document.documentElement.dataset.theme = 'dark'
          document.documentElement.dataset.textScale = 'comfortable'
        }
      })()
    </script>
    <title>AC Clean · Gestão de Lavanderia</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2308181f'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%230ea5d8' stroke-width='2.5'/%3E%3Cpath d='M7 17c3-2 5-2 7 1 2 4 7 5 12-1-1 7-5 11-11 11S7 23 7 17Z' fill='%237fd2ee'/%3E%3Ccircle cx='14' cy='13' r='1.5' fill='%230ea5d8'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
